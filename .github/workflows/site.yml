name: Site

# Пересобирает сайт https://coinman-dev.github.io/own-backup/ после выпуска:
# версия, ссылки и размеры файлов в странице берутся из только что
# опубликованного выпуска (scripts/build-site.sh, scripts/site-release.py).
# Одна короткая задача на Ubuntu, без сборки программы и без кэшей.
#
# Посетители видят новую версию и без этого: main.js спрашивает API GitHub
# в браузере. Пересборка нужна поисковикам и браузерам без скриптов.
#
# Страница собирается из ветки по умолчанию (main), а не из тега выпуска:
# правка заметок старого выпуска не вернёт старый сайт.

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Build and publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          SITE_GIT_NAME: github-actions[bot]
          SITE_GIT_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          SITE_COMMIT_MESSAGE: "Сайт: сборка после выпуска ${{ github.event.release.tag_name || 'вручную' }}"
        run: bash scripts/build-site.sh --publish
