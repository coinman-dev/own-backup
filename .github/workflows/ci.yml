name: Validate

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full validation before a release or merge'
        type: boolean
        default: true
      windows:
        description: 'Include Windows validation'
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      full:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: own-backup-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: Frontend and vendor checks
    if: (github.event_name == 'push' && !inputs.full) || (github.event_name == 'workflow_dispatch' && !inputs.full)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json
      - name: Validate frontend
        working-directory: crates/gui/frontend
        run: |
          npm ci
          npm run build
      - name: Verify local GTK3 compatibility patches
        run: python3 scripts/check-vendor.py

  windows:
    timeout-minutes: 60
    if: ((github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full) && (github.event_name == 'pull_request' || inputs.windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build frontend
        working-directory: crates/gui/frontend
        run: |
          npm ci
          npm run build
          npm audit
      - name: Check Rust and vendor advisories
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
          python scripts/check-vendor.py --audit
      - name: Test Windows workspace
        run: cargo test --workspace --locked -j 2
      - name: Link Windows GUI with static CRT
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p own-backup-gui -j 2
