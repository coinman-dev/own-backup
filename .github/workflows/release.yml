name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.2-beta (must exist unless dry_run is enabled)'
        required: true
        type: string
      dry_run:
        description: 'Build and test the selected branch without publishing a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG and package version $version differ." }
          if ($env:DRY_RUN -ne 'true') {
            $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout is not the requested tag.' }
          }
      - name: Release notes
        shell: bash
        run: |
          mkdir -p target/notes
          bash scripts/release-notes.sh "${RELEASE_TAG#v}" > target/notes/release-notes.md
          cat target/notes/release-notes.md
      # protoc 23.4, as arduino/setup-protoc@v3 gave; fetched directly, since
      # that action still runs on the deprecated Node.js 20.
      - name: Install protoc
        shell: pwsh
        run: |
          $v = '23.4'
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir -Force
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $dir 'bin')
          & (Join-Path $dir 'bin\protoc.exe') --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json
      # The window's pages are compiled into own-backup-gui.exe, so they come first.
      - name: Build frontend
        working-directory: crates/gui/frontend
        shell: bash
        run: |
          npm ci
          npm run build
          npm audit
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check Rust and vendor advisories
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
          python scripts/check-vendor.py --audit
      # The tests run in groups, so the step that was running names the
      # group even when the runner dies and its log is lost (19.11.2026: two
      # hours, no log, no timeout). Temporary files go to the runner's
      # temporary folder on D: — larger than C:, where a full drive takes the
      # runner itself down, and named without 8.3 aliases (C:\Users\RUNNER~1).
      - name: Free space before the tests
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: Test common, storage and metadata crates
        timeout-minutes: 30
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked -j 2 --no-fail-fast -p own-backup-common -p own-backup-metadata -p own-backup-cleanup -p own-backup-inventory -p own-backup-snapshot
      # Every group runs even after a failure, so one run shows them all;
      # the job still fails.
      - name: Test backup crate
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked -j 2 --no-fail-fast -p own-backup-backup
      - name: Test core crate
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked -j 2 --no-fail-fast -p own-backup-core
      - name: Test the rest of the workspace
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --locked -j 2 --no-fail-fast --exclude own-backup-common --exclude own-backup-metadata --exclude own-backup-cleanup --exclude own-backup-inventory --exclude own-backup-snapshot --exclude own-backup-backup --exclude own-backup-core
      - name: Free space after the tests
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: Build Windows x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p own-backup-gui -p own-backup-service -p own-backup-cli -p own-backup-shell -j 2
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path ${env:ProgramFiles(x86)} 'NSIS')
      # makensis.exe here is the one that reads a script without a byte-order
      # mark in the ANSI code page; the script refuses to pack such a copy.
      - name: Package installer
        shell: bash
        run: bash scripts/build-installer.sh --skip-build
      - name: Installer integration check
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Installer target/dist/own-backup-install.exe
      # The release names the installer with its version: the README, the
      # release notes and the site link to that name.
      - name: Name the installer
        shell: bash
        run: |
          mkdir -p target/release-files
          cp target/dist/own-backup-install.exe "target/release-files/own-backup-install_${RELEASE_TAG#v}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: target/release-files/*.exe
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: target/notes/release-notes.md
          if-no-files-found: error
          retention-days: 3

  # The Linux package and boot medium. Built on Ubuntu 24.04, the oldest
  # supported system: the binaries take its glibc and WebKitGTK as their
  # minimum (plan §6, decision 2), and Debian 13 installs the same package.
  # Packaging only — the Linux tests run on the owner's machine (AGENTS.md).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release tag.'; exit 1; }
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG and package version $version differ."; exit 1; }
          if [[ "$DRY_RUN" != true ]]; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo 'Checkout is not the requested tag.'; exit 1; }
          fi
      # The medium's build needs ~10 GiB beside the Rust build; the runner's
      # preinstalled SDKs are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config \
            protobuf-compiler libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev dpkg-dev desktop-file-utils \
            debootstrap debian-archive-keyring
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build the package
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          mkdir -p target/release-files
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" DEB_REVISION=none \
            OUTPUT="$PWD/target/release-files/own-backup_${v//-/.}_amd64.deb" scripts/build-deb.sh
          dpkg-deb -f target/release-files/*.deb Package Version Depends
      - name: Build the boot medium
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          v="${RELEASE_TAG#v}"
          df -h /
          OBK_MEDIA_RESERVE_GIB=0 OUTPUT="$PWD/target/release-files/OwnBackup-Linux-${v//-/.}_amd64.iso" \
            scripts/build-linux-media.sh --deb "$PWD/target/release-files/own-backup_${v//-/.}_amd64.deb"
          rm -f target/release-files/*.sha256
          ls -l target/release-files
      # The medium's build tree is root's (a chroot with device nodes): left in
      # target/, the Rust cache cannot pack it and fails to save at the end.
      - name: Remove the medium's build tree
        if: always()
        run: sudo rm -rf target/linux-media
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            target/release-files/*.deb
            target/release-files/*.iso
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.exe *.deb *.iso > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # One checksum list per release: the lines it already has for other
          # files (put in by scripts/upload-linux-media.sh or by hand) are
          # kept; ours replace the lines of their own names.
          if gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir old 2>/dev/null; then
            awk 'NR == FNR { n = $2; sub(/^\*/, "", n); ours[n] = 1; next }
                 { n = $2; sub(/^\*/, "", n); if (!(n in ours)) print }' \
              dist/SHA256SUMS.txt old/SHA256SUMS.txt > merged.txt
            cat dist/SHA256SUMS.txt >> merged.txt
            mv merged.txt dist/SHA256SUMS.txt
          fi
          prerelease=false
          [[ "$RELEASE_TAG" == *-* ]] && prerelease=true
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Own Backup ${RELEASE_TAG#v}" --notes-file notes/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --notes-file notes/release-notes.md
