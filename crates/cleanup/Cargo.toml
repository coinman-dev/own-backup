[package]
name = "own-backup-cleanup"
version.workspace = true
edition.workspace = true
license-file.workspace = true

# Disk cleanup (the window's «Очистка»): what can be removed, how much it
# takes, and removing it — in the service, for the system and for each chosen
# user. Windows first (PLAN §6б); on Linux the catalogue is empty.
[dependencies]
own-backup-common = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
