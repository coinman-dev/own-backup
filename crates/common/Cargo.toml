[package]
name = "own-backup-common"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust-i18n = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Three small questions asked of Windows from here: is this WinPE (one
# registry key), where a program keeps its settings (the same), and is the
# medium's desktop running (one named object, opened and closed).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
