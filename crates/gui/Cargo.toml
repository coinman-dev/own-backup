[package]
name = "own-backup-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "own-backup-gui"
path = "src/main.rs"

[features]
# Production builds embed the frontend and serve it over the custom protocol.
# `tauri dev` runs with --no-default-features to use the vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
own-backup-common = { workspace = true }
own-backup-inventory = { workspace = true }
own-backup-metadata = { workspace = true }
own-backup-scheduler = { workspace = true }
own-backup-restore = { workspace = true }
own-backup-backup = { workspace = true }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = { workspace = true }
prost-build = "0.13"
