[package]
name = "own-backup-gui"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "own-backup-gui"
path = "src/main.rs"

[features]
# Production builds embed the frontend and serve it over the custom protocol.
# `tauri dev` runs with --no-default-features to use the vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
own-backup-common = { workspace = true }
rust-i18n = { workspace = true }
own-backup-inventory = { workspace = true }
own-backup-metadata = { workspace = true }
own-backup-scheduler = { workspace = true }
own-backup-restore = { workspace = true }
own-backup-backup = { workspace = true }
own-backup-core = { workspace = true }
own-backup-client = { workspace = true }
tauri = { version = "2.12.1", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tonic = { workspace = true }
prost = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The notification-area icon (`--tray`): libayatana-appindicator through
# `tray-icon`, on GTK's own loop — the same GTK 3 the window's WebKitGTK uses.
# No libxdo: the menu has no predefined edit items.
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
gtk = "0.18"
glib = "0.18.5"
png = "0.17"

[dev-dependencies]
tempfile = "3"


[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
tonic-build = { workspace = true }
prost-build = "0.13"
