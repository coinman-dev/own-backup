[package]
name = "own-backup-shell"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "own-backup-shell"
path = "src/main.rs"

[dependencies]
# Only for two answers that must not be given twice: am I in WinPE, and where
# does the medium want logs. Both already have one definition in `common`.
own-backup-common = { workspace = true }
rust-i18n = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The boot medium's strip on Linux (plan §6, stage 6, "taskbar"): GTK 3, as
# the window's own Tauri build already links it, on a layer-shell surface of
# labwc (libgtk-layer-shell, called directly: src/linux/layer.rs), and the
# open windows through wlroots' foreign-toplevel protocol on a Wayland
# connection of its own.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
pangocairo = "0.18"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
