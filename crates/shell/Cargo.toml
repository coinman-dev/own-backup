[package]
name = "own-backup-shell"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "own-backup-shell"
path = "src/main.rs"

[dependencies]
# Only for two answers that must not be given twice: am I in WinPE, and where
# does the medium want logs. Both already have one definition in `common`.
own-backup-common = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
