[package]
name = "own-backup-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "own-backup-service"
path = "src/main.rs"

[dependencies]
own-backup-common = { workspace = true }
own-backup-inventory = { workspace = true }
own-backup-snapshot = { workspace = true }
own-backup-backup = { workspace = true }
own-backup-restore = { workspace = true }
own-backup-metadata = { workspace = true }
own-backup-scheduler = { workspace = true }
own-backup-core = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = { workspace = true }
prost-build = "0.13"
