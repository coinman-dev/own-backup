[package]
name = "own-backup-service"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
a09-lab-gate = ["own-backup-core/a09-lab-gate"]
a07-lab-gate = ["own-backup-core/a07-lab-gate"]

[[bin]]
name = "own-backup-service"
path = "src/main.rs"

[dependencies]
# `serde`: a passphrase arrives in JSON straight into a buffer that is wiped.
zeroize = { version = "1", features = ["serde"] }
own-backup-common = { workspace = true }
rust-i18n = { workspace = true }
own-backup-inventory = { workspace = true }
own-backup-snapshot = { workspace = true }
own-backup-backup = { workspace = true }
own-backup-restore = { workspace = true }
own-backup-metadata = { workspace = true }
own-backup-scheduler = { workspace = true }
own-backup-core = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
getrandom = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# polkit (the destructive operations' administrator check) and logind over
# D-Bus. The same zbus as own-backup-backup's power_linux.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6", features = ["p2p"] }

[dev-dependencies]
tempfile = "3"
own-backup-client = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
prost-build = "0.13"
