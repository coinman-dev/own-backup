[package]
name = "own-backup-backup"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
own-backup-common = { workspace = true }
own-backup-snapshot = { workspace = true }
own-backup-inventory = { workspace = true }
zstd = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
aes = { workspace = true }
xts-mode = { workspace = true }
pbkdf2 = { workspace = true }
base64 = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Services",
] }
# Driver-install feature (aim_install.rs): download DriverFiles.zip + extract.
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"

[dev-dependencies]
tempfile = "3"
gpt = { workspace = true }
