[package]
name = "own-backup-backup"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
own-backup-common = { workspace = true }
rust-i18n = { workspace = true }
own-backup-snapshot = { workspace = true }
own-backup-inventory = { workspace = true }
zstd = { workspace = true }
# Volume/secret handling and seal/; wipe cipher/KDF key material on release.
aes-gcm = { workspace = true, features = ["zeroize"] }
argon2 = { workspace = true, features = ["zeroize"] }
aes = { workspace = true, features = ["zeroize"] }
# Enable wiping throughout AES-GCM's authentication-key implementation.
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
xts-mode = { workspace = true }
pbkdf2 = { workspace = true }
base64 = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
getrandom = "0.2"
md-5 = "0.10"
zeroize = { version = "1", features = ["derive"] }
# seal/: шифрование копий — пара ключей задания, ключ цепочки, ключ восстановления
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
bech32 = { workspace = true }
crc32fast = "1"
ntfs = "0.4.0"
# linux_browse/: files of a Linux partition read from Windows (the Total
# Commander plugin) — ext2/3/4, read-only, in userspace.
ext4-view = "1"
# … and btrfs (linux_browse/btrfs.rs): its zlib- and LZO-compressed extents
# (zstd is above).
flate2 = "1"
lzokay-native = "0.1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# systemd-logind over D-Bus (power_linux): sleep inhibitors, suspend, the
# scheduled poweroff after a copy, shutdown and session signals.
zbus = "6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_Storage_Vhd",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    # Разблокировка BitLocker силами Windows (windows_unlock_win.rs): провайдер
    # BitLocker живёт в WMI, и это единственный НЕинтерактивный путь к нему —
    # manage-bde читает пароль из консоли и в перенаправленный ввод не смотрит.
    "Win32_System_Wmi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Rpc",
    # Сон и выключение (power_win.rs): не давать уснуть во время копии,
    # пробуждать к расписанию, «после копии — сон / выключить».
    "Win32_System_Power",
    "Win32_System_Shutdown",
] }
[dev-dependencies]
gpt = { workspace = true }

# power_linux's tests talk to a stand-in logind over a private connection.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6", features = ["p2p"] }
