[package]
name = "own-backup-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "own-backup-cli"
path = "src/main.rs"

[dependencies]
own-backup-common = { workspace = true }
own-backup-inventory = { workspace = true }
own-backup-snapshot = { workspace = true }
own-backup-backup = { workspace = true }
own-backup-restore = { workspace = true }
own-backup-metadata = { workspace = true }
own-backup-core = { workspace = true }
own-backup-client = { workspace = true }
clap = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
