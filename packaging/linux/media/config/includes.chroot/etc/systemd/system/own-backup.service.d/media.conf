# The engine on the boot medium. Media mode itself comes from the kernel
# command line (`own-backup.media`), not from here; this adds only where its
# log copy goes: the stick's log partition, when own-backup-media-log found
# one (OWN_BACKUP_LOG_MIRROR, see crates/common/src/log_mirror.rs).
[Unit]
After=own-backup-media-log.service
Wants=own-backup-media-log.service

[Service]
EnvironmentFile=-/run/own-backup-media-log.env
