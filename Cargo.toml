[workspace]
members = [
    "crates/common",
    "crates/inventory",
    "crates/snapshot",
    "crates/backup",
    "crates/restore",
    "crates/metadata",
    "crates/scheduler",
    "crates/core",
    "crates/client",
    "crates/service",
    "crates/cli",
    "crates/gui",
    "crates/shell",
]
resolver = "2"
exclude = ["vendor/glib", "vendor/glib-macros", "vendor/gtk3-macros"]

[patch.crates-io]
# GTK3 requires glib 0.18. Keep its ABI and backport the upstream
# VariantStrIter fix; provenance is checked by scripts/check-vendor.py.
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
# ntfs 0.4.0 (the latest) needs binrw 0.11, whose `default_reader` helper
# trips a future-incompatibility lint; the one function is written out
# without the attribute. Checked by scripts/check-vendor.py.
binrw = { path = "vendor/binrw" }

[workspace.package]
version = "0.1.6-beta"
edition = "2021"
# Source-available, free for noncommercial use (PolyForm Noncommercial 1.0.0);
# commercial use requires a separate license — see LICENSE / COMMERCIAL-LICENSE.md.
# PolyForm licenses are not in the SPDX list, so we point at the file.
license-file = "LICENSE"
authors = ["coinman.dev <coinman.dev@gmail.com>"]

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Compression
zstd = "0.13"
aes-gcm = "0.10"
argon2 = "0.5"

# Encryption
# Volume decryption (LUKS): AES-XTS + LUKS KDFs
aes = "0.8"
xts-mode = "0.5"
pbkdf2 = "0.12"
base64 = "0.22"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Checksums
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha2 = "0.10"

# Partition tables
gpt = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Messages in Russian and English: each crate's texts in its locales/*.json,
# compiled in. Called through own_backup_common::tr! (see common/src/lang.rs).
rust-i18n = "4"

# Cron
cron = "0.13"

# Шифрование копий (§7 плана): пара ключей задания, заворачивание ключа
# цепочки и ключ восстановления. Симметрика и KDF уже были (aes, xts-mode,
# aes-gcm, argon2, sha2).
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
bech32 = "0.11"

# Internal crates
own-backup-common = { path = "crates/common" }
own-backup-inventory = { path = "crates/inventory" }
own-backup-snapshot = { path = "crates/snapshot" }
own-backup-backup = { path = "crates/backup" }
own-backup-restore = { path = "crates/restore" }
own-backup-metadata = { path = "crates/metadata" }
own-backup-scheduler = { path = "crates/scheduler" }
own-backup-core = { path = "crates/core" }
own-backup-client = { path = "crates/client" }

# Argon2id is deliberately expensive, and an unoptimised build makes it
# absurdly so: the production profile (256 MiB, 3 passes) takes ~10 s per
# derivation in a debug build against well under a second optimised. That cost
# lands on every test that prepares or opens a key — and on the laboratory
# probe, which is built in debug and spends half a minute before it starts.
# Optimising just the hash crates changes no behaviour and costs nothing in
# compile time worth mentioning.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
# The same for LUKS: a key slot is PBKDF2-SHA256 (or Argon2) sized by
# cryptsetup for ~2 s of OPTIMISED code — minutes in a debug build (stand,
# 2026-10-23: a debug service spent two minutes on one wrong password) — and
# AES-XTS decrypts every block read from a locked LUKS or BitLocker volume.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.xts-mode]
opt-level = 3
[profile.test.package.pbkdf2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.test.package.hmac]
opt-level = 3
[profile.test.package.aes]
opt-level = 3
[profile.test.package.xts-mode]
opt-level = 3
