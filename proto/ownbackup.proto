syntax = "proto3";
package ownbackup;

// Backup service API (plan v2, phase 4).
//
// The rich types (Job, JobRun, QueueSnapshot, JobProgress, DiskInfo) are the
// Rust structs in `own-backup-core` / `own-backup-common`; both the service and
// its clients are Rust and share those crates, so they travel as JSON strings
// inside thin envelopes rather than being re-declared field-by-field here. This
// keeps the wire format in lock-step with the model as it evolves. Simple
// parameters (ids) stay typed.
service BackupService {
  // --- Jobs ---
  rpc ListJobs(Empty) returns (JsonReply);           // JSON: [Job]
  rpc GetJob(IdRequest) returns (JsonReply);         // JSON: Job | null
  rpc SaveJob(JsonRequest) returns (JsonReply);      // in: Job JSON -> out: stored Job JSON
  rpc DeleteJob(DeleteJobRequest) returns (JsonReply);  // JSON: JobFilesDeleted
  rpc NewJobTemplate(Empty) returns (JsonReply);     // JSON: Job (default template)
  rpc DefaultExclusions(Empty) returns (JsonReply);  // JSON: [string]

  // --- Queue / runs ---
  rpc RunJob(IdRequest) returns (Empty);             // enqueue a backup
  rpc CancelQueued(IdRequest) returns (Empty);       // drop a still-pending job
  rpc CancelRunning(Empty) returns (Empty);          // signal-cancel the running job
  rpc GetQueue(Empty) returns (JsonReply);           // JSON: QueueSnapshot
  rpc ListActivity(Empty) returns (JsonReply);       // JSON: [JobRun]
  rpc StreamEvents(Empty) returns (stream Event);    // progress / queue / finished

  // --- Encrypted volumes ---
  // Unlock an encrypted (LUKS) source volume and probe its inner filesystem.
  // Runs in the privileged service (raw-disk access), NOT the unelevated GUI.
  // JSON in:  { "volume": string, "password": string, "remember": bool }.
  // JSON out: VolumeUnlockDto { ok, filesystem, label, used_bytes }.
  // On ok the password is cached for this session; when "remember" is set it is
  // also persisted OS-protected so scheduled runs can use it.
  rpc ProvideVolumePassword(JsonRequest) returns (JsonReply);

  // --- Inventory ---
  rpc ListDisks(Empty) returns (JsonReply);          // JSON: [DiskInfo]

  rpc GetServiceStatus(Empty) returns (JsonReply);   // JSON: { version, uptime_secs, queue }

  // --- Direct engine operations (run in the privileged service) ---
  // Long-running; progress is streamed on StreamEvents with kinds
  //   "restore" / "verify" -> EngineProgress, "restore-disk" -> DiskRestoreProgress.
  // CancelEngineOp signal-cancels the running restore/verify (separate from a
  // backup's CancelRunning).
  rpc RestoreVolume(JsonRequest) returns (JsonReply);  // in: {image_path,target} -> RestoreSummary
  rpc VerifyImage(JsonRequest) returns (JsonReply);    // in: {image_path} -> VerifySummary
  rpc MountImage(JsonRequest) returns (JsonReply);     // in: {image_path} -> {mount_point}
  rpc UnmountImage(JsonRequest) returns (Empty);       // in: {image_path}
  rpc RestoreDisk(JsonRequest) returns (JsonReply);    // in: {manifest_path,target_disk,force} -> DiskRestoreSummary
  rpc CancelEngineOp(Empty) returns (Empty);

  // --- Restore plans (the partition designer) ---
  // The GUI assembles a RestorePlan and sends it here. DryRun checks it and
  // writes nothing; Apply executes it. Unlike the operations above, a plan's
  // progress is also *retained*: GetRestoreState returns the run's full state,
  // so a window that was closed mid-restore picks up where it left off instead
  // of finding an empty screen.
  rpc DryRunRestorePlan(JsonRequest) returns (JsonReply);  // in: {plan,context} -> {results,letter_changes}
  rpc ApplyRestorePlan(JsonRequest) returns (JsonReply);   // in: RestorePlan -> RestoreRunState
  rpc GetRestoreState(Empty) returns (JsonReply);          // JSON: RestoreRunState | null
  // Cancel is addressed to a specific run, so a cancel arriving late cannot
  // take down the run that started after it. Refused outright while a
  // non-cancellable operation is in progress, rather than accepted and ignored.
  rpc CancelRestorePlan(IdRequest) returns (JsonReply);    // in: plan id -> { cancelled, reason }
  // The user read the finished run's report and closed it. GetRestoreState
  // stops returning it — the run stays in the history and in Activity.
  rpc AckRestoreRun(IdRequest) returns (Empty);            // in: plan id

  // --- Boot medium ---
  // Built from what the machine already carries: its recovery image, its
  // drivers, its WebView2. FindBaseImages reads every candidate before
  // offering it, so the user chooses from images known to be usable rather
  // than from file names. BuildMedia does the work and streams progress as an
  // engine event of kind "media".
  rpc FindBaseImages(Empty) returns (JsonReply);        // JSON: [BaseImageDto]
  rpc ListDrivers(Empty) returns (JsonReply);           // JSON: [DriverPackageDto]
  // Third-party tools installed on THIS machine that the medium could carry —
  // a file manager and a text editor, copied from the user's own installation
  // and never distributed by us.
  rpc ListMediaTools(Empty) returns (JsonReply);        // JSON: [MediaToolDto]
  rpc BuildMedia(JsonRequest) returns (JsonReply);      // in: MediaBuildOptions -> MediaBuildReport

  // --- What mounting a backup image needs on this machine ---
  // No driver of ours is installed on either platform: Windows serves the
  // image over an iSCSI target of ours to its own built-in initiator, Linux
  // uses the in-tree NBD module. Prepare starts (or loads) what that needs;
  // the service runs privileged, so the GUI never raises UAC for it.
  rpc MountBackendStatus(Empty) returns (JsonReply);   // JSON: { platform, ready, message, … }
  rpc PrepareMountBackend(Empty) returns (JsonReply);  // JSON: the same shape

  // --- The machine's boot configuration (UEFI firmware variables) ---
  // These live in the motherboard, not on a disk, so no copy of a partition
  // preserves them. Reading needs SeSystemEnvironmentPrivilege, which the
  // service has and the interface does not — hence going through here.
  // Status is one call on purpose: the entries and the loaders on the EFI
  // partitions have to come from one moment to be compared at all.
  rpc BootStatus(Empty) returns (JsonReply);        // JSON: { uefi, writable, entries, esps, … }
  rpc BootAction(JsonRequest) returns (JsonReply);  // in: { action, … } -> { message, safety_copy }
}

message Empty {}
message IdRequest { string id = 1; }
// Delete a job; when delete_files is set, also erase the job's image files.
message DeleteJobRequest { string id = 1; bool delete_files = 2; }
message JsonRequest { string json = 1; }
message JsonReply { string json = 1; }

// One orchestration event. `kind` selects how to read `json`:
//   "progress" -> JobProgress, "queue" -> QueueSnapshot, "finished" -> JobRun.
message Event {
  string kind = 1;
  string json = 2;
}
