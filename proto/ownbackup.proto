syntax = "proto3";
package ownbackup;

// Backup service API (plan v2, phase 4).
//
// The rich types (Job, JobRun, QueueSnapshot, JobProgress, DiskInfo) are the
// Rust structs in `own-backup-core` / `own-backup-common`; both the service and
// its clients are Rust and share those crates, so they travel as JSON strings
// inside thin envelopes rather than being re-declared field-by-field here. This
// keeps the wire format in lock-step with the model as it evolves. Simple
// parameters (ids) stay typed.
service BackupService {
  // --- Jobs ---
  rpc ListJobs(Empty) returns (JsonReply);           // JSON: [Job]
  rpc GetJob(IdRequest) returns (JsonReply);         // JSON: Job | null
  rpc SaveJob(JsonRequest) returns (JsonReply);      // in: Job JSON -> out: stored Job JSON
  rpc DeleteJob(IdRequest) returns (Empty);
  rpc NewJobTemplate(Empty) returns (JsonReply);     // JSON: Job (default template)
  rpc DefaultExclusions(Empty) returns (JsonReply);  // JSON: [string]

  // --- Queue / runs ---
  rpc RunJob(IdRequest) returns (Empty);             // enqueue a backup
  rpc CancelQueued(IdRequest) returns (Empty);       // drop a still-pending job
  rpc CancelRunning(Empty) returns (Empty);          // signal-cancel the running job
  rpc GetQueue(Empty) returns (JsonReply);           // JSON: QueueSnapshot
  rpc ListActivity(Empty) returns (JsonReply);       // JSON: [JobRun]
  rpc StreamEvents(Empty) returns (stream Event);    // progress / queue / finished

  // --- Encrypted volumes ---
  // Provide a password to unlock an encrypted (LUKS) source volume.
  // JSON in: { "volume": string, "password": string, "remember": bool }.
  // Cached in the service for this session; when "remember" is set it is also
  // persisted OS-protected so scheduled runs can use it.
  rpc ProvideVolumePassword(JsonRequest) returns (Empty);

  // --- Inventory ---
  rpc ListDisks(Empty) returns (JsonReply);          // JSON: [DiskInfo]

  rpc GetServiceStatus(Empty) returns (JsonReply);   // JSON: { version, uptime_secs, queue }

  // --- Direct engine operations (run in the privileged service) ---
  // Long-running; progress is streamed on StreamEvents with kinds
  //   "restore" / "verify" -> EngineProgress, "restore-disk" -> DiskRestoreProgress.
  // CancelEngineOp signal-cancels the running restore/verify (separate from a
  // backup's CancelRunning).
  rpc RestoreVolume(JsonRequest) returns (JsonReply);  // in: {image_path,target} -> RestoreSummary
  rpc VerifyImage(JsonRequest) returns (JsonReply);    // in: {image_path} -> VerifySummary
  rpc MountImage(JsonRequest) returns (JsonReply);     // in: {image_path} -> {mount_point}
  rpc UnmountImage(JsonRequest) returns (Empty);       // in: {image_path}
  rpc RestoreDisk(JsonRequest) returns (JsonReply);    // in: {manifest_path,target_disk,force} -> DiskRestoreSummary
  rpc CancelEngineOp(Empty) returns (Empty);
}

message Empty {}
message IdRequest { string id = 1; }
message JsonRequest { string json = 1; }
message JsonReply { string json = 1; }

// One orchestration event. `kind` selects how to read `json`:
//   "progress" -> JobProgress, "queue" -> QueueSnapshot, "finished" -> JobRun.
message Event {
  string kind = 1;
  string json = 2;
}
